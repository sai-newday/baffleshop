name: dbt Blast Radius Impact Analysis

on:
  pull_request:
    paths:
      - 'models/**'
      - 'macros/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - 'requirements.txt'

permissions:
  pull-requests: write
  contents: read

jobs:
  dbt-impact-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout base branch for diff
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run dbt deps
        run: |
          dbt deps
        env:
          PROFILE_CONFIG_DIR: ${{ github.workspace }}

      - name: Generate dbt documentation
        run: |
          dbt docs generate
        env:
          PROFILE_CONFIG_DIR: ${{ github.workspace }}

      - name: Verify dbt artifacts
        run: |
          if [[ ! -f "target/manifest.json" ]]; then
            echo "ERROR: target/manifest.json not found"
            exit 1
          fi
          if [[ ! -f "target/catalog.json" ]]; then
            echo "ERROR: target/catalog.json not found"
            exit 1
          fi
          echo "✓ dbt artifacts verified"

      - name: Detect dbt model and column changes
        id: detect_changes
        run: |
          python .github/scripts/detect_changes.py \
            --base-ref origin/${{ github.base_ref }} \
            --head-ref HEAD \
            --output changes.json

      - name: Check if changes detected
        id: check_changes
        run: |
          if python .github/scripts/check_changes.py changes.json; then
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
          fi

      - name: Run impact analysis
        if: steps.check_changes.outputs.HAS_CHANGES == 'true'
        id: impact_analysis
        run: |
          python .github/scripts/impact_analysis.py \
            --changes-file changes.json \
            --manifest-file target/manifest.json \
            --catalog-file target/catalog.json \
            --output impact_results.json

      - name: Generate PR comment
        if: steps.check_changes.outputs.HAS_CHANGES == 'true'
        id: generate_comment
        run: |
          python .github/scripts/generate_comment.py \
            --impact-file impact_results.json \
            --changes-file changes.json \
            --output pr_comment.md

      - name: Post or update PR comment
        if: steps.check_changes.outputs.HAS_CHANGES == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr_comment.md', 'utf8');
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔍 dbt Blast Radius Analysis')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
              console.log('Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
              console.log('Created new PR comment');
            }

      - name: No changes detected
        if: steps.check_changes.outputs.HAS_CHANGES == 'false'
        run: |
          echo "No dbt model or column lineage impact detected."
