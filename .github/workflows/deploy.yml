name: dbt Colibri Example

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BAFFLESHOP_DUCKDB_PATH: baffleshop.duckdb
      JAFFLESHOP_DUCKDB_PATH: baffleshop.duckdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout jaffleshop
        uses: actions/checkout@v4
        with:
          repository: sai-newday/jaffleshop
          path: ./jaffleshop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3 -m pip install uv

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      - name: Create CI dbt profile
        run: |
          mkdir -p ./.ci
          cat > ./.ci/profiles.yml <<'EOF'
          jaffleshop:
            outputs:
              ci:
                type: duckdb
                path: "{{ env_var('JAFFLESHOP_DUCKDB_PATH', 'baffleshop.duckdb') }}"
                threads: 4
            target: ci
          baffleshop:
            outputs:
              ci:
                type: duckdb
                path: "{{ env_var('BAFFLESHOP_DUCKDB_PATH', 'baffleshop.duckdb') }}"
                threads: 4
            target: ci
          EOF

      - name: Build upstream public model
        run: |
          dbt deps --project-dir ./jaffleshop --profiles-dir ./.ci
          dbt seed --project-dir ./jaffleshop --profiles-dir ./.ci
          dbt run --project-dir ./jaffleshop --profiles-dir ./.ci --select +public_customers

      - name: Initialize dbt
        run: |
          dbt deps --profiles-dir ./.ci
          dbt compile --profiles-dir ./.ci
          dbt seed --profiles-dir ./.ci
          dbt run --profiles-dir ./.ci
          dbt compile --profiles-dir ./.ci
          dbt docs generate --profiles-dir ./.ci

      - name: Run Colibri
        run: colibri generate

      - name: Prepare artifact
        run: |
          if [ -f dist/index.html ]; then
            echo "Preparing artifact for GitHub Pages..."
          else
            echo "Error: dist/index.html not found!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
